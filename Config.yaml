
seed: 42
data:
  raw_path: "Data/Datasets/PLACE_YOUR_DATASET_HERE.csv"
  target: "esi"
  test_size: 0.2
models:
  xgboost_tuned:
    objective: "multi:softprob"
    num_class: 5
    eval_metric: "mlogloss"
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.1
    subsample: 0.7
    colsample_bytree: 0.8
    min_child_weight: 1
    gamma: 0.1
    random_state: 42
paths:
  model_out: "w8_xgboost_final.joblib"
